type Transaction @aws_api_key @aws_iam @aws_cognito_user_pools {
  transactionId: ID!
  amount: Float!
  currency: String!
  merchant: String!
  category: String!
  status: String!
  riskScore: Int!
  fraudFlag: Boolean!
  source: String!
  processingRegion: String!
  processingLatencyMs: Int!
  eventId: String!
  createdAt: AWSDateTime!
}

type TransactionConnection @aws_api_key @aws_iam @aws_cognito_user_pools {
  items: [Transaction!]!
  nextToken: String
}

type Stats @aws_api_key @aws_iam @aws_cognito_user_pools {
  totalCount: Int!
  totalVolume: Float!
  fraudRate: Float!
  avgRiskScore: Float!
  avgLatencyMs: Float!
}

type Query {
  listTransactions(limit: Int, nextToken: String): TransactionConnection!
    @aws_api_key
    @aws_iam
    @aws_cognito_user_pools
  getStats: Stats!
    @aws_api_key
    @aws_iam
    @aws_cognito_user_pools
}

type Mutation {
  notifyTransaction(input: TransactionInput!): Transaction!
    @aws_iam
}

type Subscription {
  onTransactionAdded: Transaction
    @aws_subscribe(mutations: ["notifyTransaction"])
    @aws_cognito_user_pools
}

input TransactionInput {
  transactionId: ID!
  amount: Float!
  currency: String!
  merchant: String!
  category: String!
  status: String!
  riskScore: Int!
  fraudFlag: Boolean!
  source: String!
  processingRegion: String!
  processingLatencyMs: Int!
  eventId: String!
  createdAt: AWSDateTime!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
