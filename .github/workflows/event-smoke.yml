name: Event Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/**'
      - 'config/infra-outputs.json'
      - '.github/workflows/event-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  event-smoke:
    name: Event Pipeline Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN secret not set"
            exit 1
          fi
          if [ ! -f "config/infra-outputs.json" ] && [ -z "${{ vars.INFRA_OUTPUTS_JSON }}" ]; then
            echo "::error::Infrastructure config not found"
            exit 1
          fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Write infrastructure config
        run: |
          if [ -f "config/infra-outputs.json" ]; then
            echo "Using committed infra config"
          else
            mkdir -p config
            echo '${{ vars.INFRA_OUTPUTS_JSON }}' > config/infra-outputs.json
          fi

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run event smoke test
        env:
          INFRA_CONFIG: ${{ github.workspace }}/config/infra-outputs.json
        run: ./scripts/event-smoke.sh

      - name: Report smoke regression issue
        if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'txwatch smoke regression'
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              'Event smoke workflow failed on `main`.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Event: ${context.eventName}`,
              `- SHA: ${context.sha}`,
              `- Run: ${runUrl}`,
              '',
              'Please investigate the failing Event Pipeline Smoke job and restore event ingestion.'
            ].join('\n')

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })

            const existing = issues.find((issue) => issue.title.toLowerCase() === title)

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              })

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: created.data.number,
                  labels: ['incident', 'smoke']
                })
              } catch (e) {
                core.warning(`Could not add labels: ${e.message}`)
              }
            }
