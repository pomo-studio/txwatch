name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-config:
    name: Check Configuration
    runs-on: ubuntu-latest
    outputs:
      has_role: ${{ steps.check.outputs.has_role }}
      has_config: ${{ steps.check.outputs.has_config }}
    steps:
      - uses: actions/checkout@v4
      - name: Check prerequisites
        id: check
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "has_role=true" >> $GITHUB_OUTPUT
          else
            echo "has_role=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS_ROLE_ARN secret not set"
          fi

          if [ -f "config/infra-outputs.json" ] || [ -n "${{ vars.INFRA_OUTPUTS_JSON }}" ]; then
            echo "has_config=true" >> $GITHUB_OUTPUT
          else
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "::warning::Infrastructure config not found"
          fi

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: check-config
    if: needs.check-config.outputs.has_role == 'true' && needs.check-config.outputs.has_config == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Write infrastructure config
        run: |
          if [ -f "config/infra-outputs.json" ]; then
            echo "Using committed infra config"
          else
            mkdir -p config
            echo '${{ vars.INFRA_OUTPUTS_JSON }}' > config/infra-outputs.json
          fi

      - name: Deploy
        env:
          INFRA_CONFIG: ${{ github.workspace }}/config/infra-outputs.json
        run: ./scripts/deploy.sh

      - name: Get Application URL
        id: get-url
        run: |
          URL=$(jq -r '.application_url.value // .application_url' config/infra-outputs.json)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Application URL: $URL"

      - name: Smoke Test
        run: |
          sleep 15
          URL="${{ steps.get-url.outputs.url }}/api/health"
          for i in 1 2 3; do
            if curl -sf "$URL" > /dev/null; then
              echo "Smoke test passed!"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed"
          exit 1

  skip-notify:
    name: Notify Skipped
    runs-on: ubuntu-latest
    needs: check-config
    if: needs.check-config.outputs.has_role != 'true' || needs.check-config.outputs.has_config != 'true'
    steps:
      - name: Provide setup instructions
        run: |
          echo "::warning::Deployment skipped — AWS_ROLE_ARN secret or infra config not found"
          echo "Configure AWS_ROLE_ARN from pomo core outputs: github_actions_role_arns.txwatch"
